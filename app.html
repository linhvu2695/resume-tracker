<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Resume Tracker</title>
<style>
:root{
  --bg:#0f1216; --panel:#161b22; --panel2:#1c232c; --line:#2a323d;
  --fg:#e6edf3; --dim:#8b97a6; --accent:#4aa3ff; --amber:#ffb454;
  --green:#3fb950; --red:#f85149; --violet:#a371f7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
     font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--panel);
       border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
h1{font-size:15px;margin:0;padding:14px 0;font-weight:600;letter-spacing:.2px}
h1 span{color:var(--accent)}
nav{display:flex;gap:2px}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);
           padding:14px 14px;font:inherit;cursor:pointer}
nav button:hover{color:var(--fg)}
nav button.on{color:var(--fg);border-bottom-color:var(--accent)}
.sp{flex:1}
main{padding:22px 20px 60px;max-width:1180px;margin:0 auto}
section{display:none} section.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card.click{cursor:pointer} .card.click:hover{border-color:var(--accent)}
.row{display:flex;gap:14px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.muted{color:var(--dim)} .sm{font-size:12.5px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
      border:1px solid var(--line);background:var(--panel2)}
.s-draft{color:var(--dim)} .s-applied{color:var(--accent);border-color:#1f4d7a}
.s-screening{color:var(--amber);border-color:#6b4d1f} .s-interview{color:var(--violet);border-color:#4a2f7a}
.s-offer{color:var(--green);border-color:#1f5c2e} .s-rejected{color:var(--red);border-color:#6b2420}
.s-withdrawn{color:var(--dim)}
button.btn{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:7px;
           padding:7px 13px;font:inherit;cursor:pointer}
button.btn:hover{border-color:var(--accent)} button.btn.pri{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:600}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--fg);
      border-radius:7px;padding:8px 10px;font:inherit;width:100%}
textarea{min-height:120px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
label{display:block;margin:10px 0 4px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
table{width:100%;border-collapse:collapse} td,th{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
tr.click{cursor:pointer} tr.click:hover{background:var(--panel2)}
.warn{background:#2b1d10;border:1px solid #6b4d1f;color:var(--amber);padding:9px 12px;border-radius:8px;font-size:13px}
.err{background:#2b1414;border:1px solid #6b2420;color:var(--red);padding:9px 12px;border-radius:8px;font-size:13px}
iframe.pdf{width:100%;height:78vh;border:1px solid var(--line);border-radius:9px;background:#fff}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.ev{border-left:2px solid var(--line);padding:4px 0 4px 12px;margin-left:5px}
a{color:var(--accent)}
.sep{height:1px;background:var(--line);margin:16px 0}
</style>
</head>
<body>
<header>
  <h1>Resume <span>Tracker</span></h1>
  <nav id="nav"></nav>
  <div class="sp"></div>
  <span class="muted sm" id="hdr"></span>
</header>
<main id="main"></main>
<script src="/web/app.js"></script>
</body>
</html>
